<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matte Cyber TTS Studio - Arabe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .glass-input {
            background: rgba(2, 6, 23, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .glow-effect {
            position: absolute;
            border-radius: 9999px;
            filter: blur(60px);
            pointer-events: none;
        }
    </style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4b6cb7">
<link rel="apple-touch-icon" href="icon.png"></head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-purple-950 min-h-screen text-slate-100 flex items-center justify-center p-4 font-sans select-none">

    <!-- Conteneur Principal Glassmorphism -->
    <div class="glass w-full max-w-xl p-8 rounded-3xl relative overflow-hidden">
        <!-- Éléments lumineux d'arrière-plan (Matte Cyber) -->
        <div class="glow-effect -top-20 -left-20 w-56 h-56 bg-purple-600/15"></div>
        <div class="glow-effect -bottom-20 -right-20 w-56 h-56 bg-indigo-600/15"></div>

        <div class="relative z-10 space-y-6">
            <header class="text-center space-y-2">
                <h1 class="text-2xl font-bold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-indigo-300 to-cyan-400">
                    استوديو تحويل النصوص إلى صوت
                </h1>
                <p class="text-xs text-slate-400">نظام ذكي يعتمد على التخزين المؤقت (Blob) بجودة عالية</p>
            </header>

            <!-- Zone de texte -->
            <div class="space-y-2">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">النص المراد تحويله</label>
                <textarea id="textInput" rows="4" 
                    class="glass-input w-full rounded-2xl p-4 text-slate-100 focus:outline-none focus:ring-2 focus:ring-purple-500/40 transition resize-none placeholder-slate-600 text-sm leading-relaxed"
                    placeholder="اكتب النص بالعربية هنا...">مرحباً بك! هذا اختبار حي لتوليد الصوت باللغة العربية بجودة عالية وبدون الحاجة لأي خادم خارجي.</textarea>
            </div>

            <!-- Sélection de la voix -->
            <div class="space-y-2">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">اختر الصوت البشري</label>
                <select id="voiceSelect" 
                    class="glass-input w-full rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-purple-500/40 transition">
                    <option value="Zeina">زينة (Zeina - أنثى / فصحى طبيعية)</option>
                    <option value="Hala">هالة (Hala - أنثى / خليجي)</option>
                    <option value="Zayd">زيد (Zayd - ذكر / فصحى)</option>
                    <option value="Naayf">نايف (Naayf - ذكر / سعودي)</option>
                </select>
            </div>

            <!-- Boutons d'action -->
            <button id="generateBtn"
                class="w-full py-4 bg-gradient-to-r from-purple-600 via-indigo-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 text-white font-semibold rounded-2xl shadow-lg shadow-purple-900/30 transition-all duration-300 transform active:scale-[0.98] cursor-pointer flex items-center justify-center gap-2 text-sm tracking-wide">
                <span>توليد الصوت وتشغيله</span>
                <span>🎙️</span>
            </button>

            <!-- Indicateur de chargement -->
            <div id="loadingIndicator" class="hidden text-center py-2 text-purple-400 text-xs animate-pulse font-medium">
                جاري الاتصال والمعالجة عبر تقنية Blob... ⚡
            </div>

            <!-- Lecteur & Téléchargement -->
            <div id="resultContainer" class="hidden pt-4 border-t border-white/5 space-y-4">
                <audio id="audioPlayer" controls class="w-full rounded-xl h-11 accent-purple-500"></audio>
                <a id="downloadLink" download="arabic_audio.mp3" 
                   class="block text-center py-3 bg-white/[0.03] hover:bg-white/[0.07] border border-white/10 rounded-xl text-xs font-medium transition text-purple-300 hover:text-white">
                    تحميل الملف بصيغة MP3 📥
                </a>
            </div>
        </div>
    </div>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const textInput = document.getElementById('textInput');
        const voiceSelect = document.getElementById('voiceSelect');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const resultContainer = document.getElementById('resultContainer');
        const audioPlayer = document.getElementById('audioPlayer');
        const downloadLink = document.getElementById('downloadLink');

        let currentAudioUrl = null;

        generateBtn.addEventListener('click', async () => {
            const text = textInput.value.trim();
            if (!text) {
                alert('الرجاء إدخال النص أولاً');
                return;
            }

            const voice = voiceSelect.value;
            generateBtn.disabled = true;
            loadingIndicator.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            if (currentAudioUrl) {
                URL.revokeObjectURL(currentAudioUrl);
            }

            try {
                const apiUrl = `https://api.streamelements.com/kappa/v2/speech?voice=${voice}&text=${encodeURIComponent(text)}`;
                
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('فشل في جلب الملف الصوتي من الخادم');

                const blob = await response.blob();
                currentAudioUrl = URL.createObjectURL(blob);

                audioPlayer.src = currentAudioUrl;
                downloadLink.href = currentAudioUrl;
                
                resultContainer.classList.remove('hidden');
                audioPlayer.play();
            } catch (error) {
                console.error(error);
                alert('حدث خطأ أثناء توليد الصوت. تأكد من اتصالك بالإنترنت.');
            } finally {
                generateBtn.disabled = false;
                loadingIndicator.classList.add('hidden');
            }
        });
    </script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));}</script>
</body>
</html>
